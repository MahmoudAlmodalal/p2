name: mahfazati-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mahfazati
      POSTGRES_USER: mahfazati
      POSTGRES_PASSWORD: mahfazati_local_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahfazati -d mahfazati"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]
    volumes: ["mahfazati_postgres_data:/var/lib/postgresql/data"]

  api:
    build:
      context: ./backend
    env_file: .env.backend.local
    environment:
      DB_NAME: mahfazati
      DB_USER: mahfazati
      DB_PASSWORD: mahfazati_local_password
      DB_HOST: postgres
      DB_PORT: "5432"
    command: >
      /bin/sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      VITE_FINANCE_API_URL: http://localhost:8000/api/v1
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      api:
        condition: service_healthy
    command: pnpm dev --host 0.0.0.0 --port 3000
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

volumes:
  mahfazati_postgres_data:
  frontend_node_modules:
